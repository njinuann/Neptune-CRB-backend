## caffeine for caching
spring.cache.type=caffeine
spring.cache.cache-names=users,products,configurations
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=3600s

# Ensure proper validation query for Oracle
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL
spring.datasource.hikari.validation-timeout=5000

# Connection Pool Settings (HikariCP is the default connection pool)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
# Keep connections alive
spring.datasource.hikari.keepalive-time=300000
#spring.datasource.hikari.tcpKeepalive=true

